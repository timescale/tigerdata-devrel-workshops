# ============================================================================
# LOCAL development stack for the data feed: a simple broker + the producer.
#
#   docker compose up --build
#   docker exec -it data-producer-broker mosquitto_sub -t 'workshop/#' -v
#
# The broker is anonymous + plaintext on 1883 (exposed to your host) — fine for
# local development, NOT for the internet. To run this publicly with TLS + auth,
# use ./setup.sh + docker-compose.server.yml instead.
#
# A consumer (see ../mqtt-to-dashboard) can reach this broker at
# host.docker.internal:1883.
# ============================================================================
name: data-producer

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: data-producer-broker
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.local.conf:/mosquitto/config/mosquitto.conf:ro

  producer:
    build: ./producer
    container_name: data-producer
    depends_on:
      - mqtt-broker
    env_file: .env
    restart: unless-stopped
