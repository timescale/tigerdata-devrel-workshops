# ============================================================================
# PUBLIC VM stack: hardened MQTT broker + the data producer, co-located.
#
#   ./setup.sh                 # first-time: make passwords, get TLS cert, up
#   docker compose -f docker-compose.server.yml logs -f producer
#
# Only port 8883 is published to the host — open that (and nothing else) in
# your cloud firewall / security group. The producer reaches the broker over
# the internal 1883 listener on the Docker network, which stays private.
# ============================================================================
name: data-producer-server

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: data-producer-broker
    restart: unless-stopped
    ports:
      - "8883:8883"          # PUBLIC TLS listener — open this in the firewall
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/aclfile:/mosquitto/config/aclfile:ro
      - ./broker/passwd:/mosquitto/config/passwd:ro
      - ./broker/certs:/mosquitto/certs:ro

  producer:
    build: ./producer
    container_name: data-producer
    restart: unless-stopped
    depends_on:
      - mqtt-broker
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: "1883"      # internal listener, not exposed to the host
      MQTT_TOPIC_BASE: workshop
      PRODUCER_INTERVAL_SECONDS: "2"
      MQTT_USERNAME: producer
      MQTT_PASSWORD: ${PRODUCER_PASSWORD:?set PRODUCER_PASSWORD in .env.server}
