# ============================================================================
# Hardened broker config for a PUBLIC VM.
#
# Two listeners:
#   8883  TLS, username/password — this is what workshop attendees connect to.
#         Open ONLY this port in the VM firewall / security group.
#   1883  plaintext, for the co-located producer on the Docker network. It is
#         NOT published to the host in docker-compose.server.yml, so it is only
#         reachable inside the compose network — never from the internet.
#
# Auth is global (per_listener_settings defaults to false), so BOTH listeners
# require a valid username/password from passwd, and the aclfile applies.
# ============================================================================

# --- Public TLS listener (attendees) ---------------------------------------
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile  /mosquitto/certs/privkey.pem

# --- Internal plaintext listener (co-located producer only) -----------------
listener 1883

# --- Authentication + authorization -----------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile

# --- Housekeeping ------------------------------------------------------------
# A workshop feed is ephemeral; no need to persist messages across restarts.
persistence false
log_dest stdout
# Cap connections as a safety valve (attendees + producer). Bump if needed.
max_connections 200
